name: Meeting audio retention validation (bounded)

on:
  push:
    branches:
      - feat/meeting-audio-retention-20261106
    paths:
      - "src/helpers/meetingAudioArchive.js"
      - "src/helpers/meetingSourceRetentionLifecycle.js"
      - "src/helpers/ipcHandlers.js"
      - "test/helpers/meetingAudioArchive.test.js"
      - "test/helpers/meetingSourceRetentionLifecycle.test.js"
      - "scripts/verify-meeting-speakers.js"
      - ".github/workflows/meeting-audio-retention-validation.yml"

permissions:
  contents: read

concurrency:
  group: meeting-audio-retention-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Focused tests, typecheck and renderer
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Install without native builds or audit
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Focused speaker validation, TypeScript and renderer
        run: npm run verify:meeting-speakers
        env:
          OPENWHISPR_LOG_LEVEL: info
